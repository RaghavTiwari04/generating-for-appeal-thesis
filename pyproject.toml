[project]
name = "greeting-cards"
version = "0.1.0"
description = "AI-generated greeting cards with saleability-conditioned generation (masters thesis)"
requires-python = ">=3.11"
readme = "README.md"

dependencies = [
    # Core ML
    "torch>=2.2",
    "torchvision>=0.17",
    "transformers>=4.40",
    "diffusers>=0.27",
    "peft>=0.10",
    "accelerate>=0.30",
    # LoRA training reads its per-image captions through a HF dataset, and the
    # diffusers training script imports this only after loading the Flux
    # transformer — undeclared, it failed fifteen minutes into a job.
    "datasets>=2.19",
    "safetensors>=0.4",
    "sentencepiece>=0.2",
    # Image / vision
    "pillow>=10.0",
    "opencv-python-headless>=4.9",
    "imagehash>=4.3",
    "scikit-image>=0.22",
    "scikit-learn>=1.4",
    "realesrgan>=0.3; platform_system != 'Windows'",
    # OCR
    "pytesseract>=0.3.10",
    # Classical ML / stats
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.12",
    "statsmodels>=0.14",
    "pingouin>=0.5",
    # Data / DB
    "psycopg[binary]>=3.1",
    "pgvector>=0.2",
    "sqlalchemy>=2.0",
    "alembic>=1.13",
    "boto3>=1.34",
    "minio>=7.2",
    # Scraping
    "httpx>=0.27",
    "beautifulsoup4>=4.12",
    "selectolax>=0.3",
    "tenacity>=8.2",
    "playwright>=1.43",
    # LLM clients
    "anthropic>=0.25",
    "openai>=1.20",
    # Web / API
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "pydantic-settings>=2.2",
    # Orchestration / infra
    "redis>=5.0",
    "celery>=5.3",
    # Tracking
    "wandb>=0.16",
    # Misc
    "python-dotenv>=1.0",
    "typer>=0.12",
    "rich>=13.7",
    "tqdm>=4.66",
    "tldextract>=5.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.9",
    "ipykernel>=6.29",
    "jupyterlab>=4.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["data", "models", "generation", "pipeline", "eval"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP", "N", "RUF"]
ignore = [
    "E501",
    "RUF001", "RUF002", "RUF003",  # Unicode Greek letters / symbols in stats code
    "E402",   # notebook-style deferred imports
    "N803",   # Prolific API params must be uppercase (PROLIFIC_PID etc.)
    "B008",   # typer.Argument() in defaults is standard pattern
    "N806",   # uppercase variables (X, B, T) standard in ML code
    "N814",   # camelcase imports as aliases
]

[tool.ruff.lint.per-file-ignores]
"notebooks/**" = ["E402", "F401"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
no_implicit_optional = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
